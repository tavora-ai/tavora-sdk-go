name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Vet (sdk)
        run: go vet ./...
      - name: Test (sdk)
        run: go test ./...
      # cli/ is a separate module (heavy TUI deps quarantined there);
      # ./... from the root does not reach it, so test it explicitly.
      # It builds against the in-tree SDK via `replace => ../`.
      - name: Vet (cli)
        working-directory: cli
        run: go vet ./...
      - name: Test (cli)
        working-directory: cli
        run: go test ./...

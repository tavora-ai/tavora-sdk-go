name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Vet (sdk)
        run: go vet ./...
      - name: Test (sdk)
        run: go test ./...
      # cli/ is a separate module (heavy TUI deps quarantined there);
      # ./... from the root does not reach it, so test it explicitly.
      # It builds against the in-tree SDK via `replace => ../`.
      # NOTE: `go vet ./...` currently fails in cli/ on pre-existing test
      # findings ("using resp before checking for errors" in
      # internal/fakeback/server/server_test.go) that predate the monorepo
      # move — the old tavora-cli repo never ran vet in CI. Add a `Vet (cli)`
      # step once those are fixed.
      - name: Test (cli)
        working-directory: cli
        run: go test ./...

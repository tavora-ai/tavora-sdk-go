name: secret-in-context
description: >
  agent.jsonc declared `context: { stripe_key: "${env.STRIPE_KEY}" }`,
  but STRIPE_KEY is is_secret=true on the deployment. context() is
  LLM-visible; secrets must never reach it. Regression-pin the 422
  shape for the secret_in_context code so the CLI renderer surfaces
  the issue cleanly. Documented in
  tavora-go/docs/agent-env-context-concept.md.

status: 422
body:
  code: secret_in_context
  status: 422
  message: 'agent.jsonc context block references is_secret env entries'
  issues:
    - file: "agent.jsonc"
      code: "secret_in_context"
      severity: "fatal"
      message: 'context["stripe_key"] references ${env.STRIPE_KEY} which is marked secret on the deployment'
      hint: 'either move "STRIPE_KEY" to fetchPolicies headers (LLM never sees it), or store it unredacted via `tavora env put STRIPE_KEY <value>` without --secret'

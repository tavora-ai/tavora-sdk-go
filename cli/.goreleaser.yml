# goreleaser config for the tavora CLI (cli/ module of tavora-sdk-go).
#
# ⚠️ LOCAL SNAPSHOT SMOKE TEST ONLY — this does NOT drive real releases.
# Actual CLI releases run from .github/workflows/cli-release.yml (plain
# shell), because the CLI releases on `cli/v*` tags and goreleaser's
# monorepo tag-prefix support (to derive a version from a prefixed,
# non-semver tag) is a GoReleaser *Pro* feature. The OSS binary rejects
# a `cli/v*` tag with "current tag is not semver". Keep this config in
# sync with cli-release.yml's build matrix when either changes.
#
# To re-home releases here in future, the path is GoReleaser Pro
# (`monorepo: { tag_prefix: cli/, dir: cli }`), which also unlocks the
# Homebrew `brews:` automation stubbed out at the bottom of this file.
#
# Single binary (`tavora`) — the TUI is the `tavora tui` subcommand,
# not a separate binary. Targets the common host shapes; CGO stays off
# so users get the same artifact they would build locally.
#
# Local snapshot build (no tag, no upload), from the repo root:
#   cd cli && goreleaser release --snapshot --clean

version: 2

project_name: tavora

before:
  hooks:
    - go mod tidy

builds:
  - id: tavora
    main: ./cmd/tavora
    binary: tavora
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    # Reproducible-ish builds: stripped symbols + injected version
    # info matching the existing `tavora version` ldflag contract
    # in cmd/tavora/version.go.
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.buildDate={{.Date}}

archives:
  - id: tavora
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: Fixes
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: Other
      order: 999

release:
  github:
    owner: tavora-ai
    name: tavora-sdk-go
  draft: false
  prerelease: auto
  # Hold the announcement message close to the changelog above —
  # GoReleaser default is fine; override here if marketing wants a
  # different shape later.
  header: |
    `tavora` CLI {{ .Tag }} — release notes below.

    Install: download the archive for your OS/arch from the assets,
    or `brew install tavora-ai/tap/tavora` once the Homebrew tap is
    published.

# Uncomment when the `tavora-ai/homebrew-tap` repo exists and you've
# added a HOMEBREW_TAP_GITHUB_TOKEN secret with `repo` scope on it.
#
# brews:
#   - name: tavora
#     repository:
#       owner: tavora-ai
#       name: homebrew-tap
#       token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
#     directory: Formula
#     homepage: "https://tavora.ai"
#     description: "Tavora CLI — code-first agent authoring + TUI"
#     license: "Apache-2.0"
#     test: |
#       system "#{bin}/tavora version"
#     install: |
#       bin.install "tavora"
